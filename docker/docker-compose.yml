# docker/docker-compose.yml
# Run from the project root:  docker-compose -f docker/docker-compose.yml up --build

services:

  # ── Zookeeper ────────────────────────────────────────────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      test: ["CMD", "bash", "-c", "echo stat | nc localhost 2181"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ── Kafka ─────────────────────────────────────────────────────────────────────
  kafka:
    image: confluentinc/cp-kafka:7.4.0
    ports:
      - "9092:9092"   # exposed so you can test from your host machine (e.g. Postman / CLI)
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181

      # TWO listeners:
      #   INTERNAL  — used by other Docker services  (kafka:29092)
      #   EXTERNAL  — used by your host machine      (localhost:9092)
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "kafka:29092", "--list"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 40s
    depends_on:
      zookeeper:
        condition: service_healthy

  # ── PostgreSQL ────────────────────────────────────────────────────────────────
  postgres:
    image: postgres:14-alpine
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}   # matches .env default
      POSTGRES_DB: ${DB_NAME:-weatherdb}            # matches .env default
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Scheduler (producer on a timer) ──────────────────────────────────────────
  # Comment this out and uncomment `producer` below if you want continuous mode.
  scheduler:
    build:
      context: ..          # project root — Dockerfile paths are relative to this
      dockerfile: docker/Dockerfile
    command: python -m producer.scheduler
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    env_file:
      - ../.env
    environment:
      # Override localhost values from .env with Docker service names
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      DB_HOST: postgres
    volumes:
      - ../logs:/app/logs   # persist logs on the host
    restart: unless-stopped

  # ── Producer (continuous, every N seconds) ────────────────────────────────────
  # Uncomment to use instead of scheduler.
  # producer:
  #   build:
  #     context: ..
  #     dockerfile: docker/Dockerfile
  #   command: python -m producer.weather_producer
  #   depends_on:
  #     kafka:
  #       condition: service_healthy
  #     postgres:
  #       condition: service_healthy
  #   env_file:
  #     - ../.env
  #   environment:
  #     KAFKA_BOOTSTRAP_SERVERS: kafka:29092
  #     DB_HOST: postgres
  #   volumes:
  #     - ../logs:/app/logs
  #   restart: unless-stopped

  # ── Consumer ──────────────────────────────────────────────────────────────────
  consumer:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: python -m consumer.weather_consumer
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    env_file:
      - ../.env
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      DB_HOST: postgres
    volumes:
      - ../logs:/app/logs   # persist logs on the host
    restart: unless-stopped

volumes:
  pgdata: