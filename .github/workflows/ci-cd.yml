name: Weather Data Pipeline CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  schedule:
    # Run daily at 8 AM UTC to verify nothing has broken
    - cron: '0 8 * * *'

env:
  PYTHON_VERSION: '3.11'   # matches your local environment (3.11.3)

# ──────────────────────────────────────────────────────────────────────────────
# Shared environment used by both test jobs
# ──────────────────────────────────────────────────────────────────────────────
x-test-env: &test-env
  OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
  CITY: Kampala
  COUNTRY: UG
  KAFKA_BOOTSTRAP_SERVERS: localhost:9092
  WEATHER_TOPIC: weather_data      # underscore — must match settings.py
  DB_USER: test_user
  DB_PASSWORD: test_password
  DB_NAME: test_weather_db
  DB_HOST: localhost
  DB_PORT: 5432

jobs:

  # ── Unit tests ───────────────────────────────────────────────────────────────
  test:
    runs-on: ubuntu-latest

    services:
      zookeeper:
        image: confluentinc/cp-zookeeper:7.4.0
        ports:
          - 2181:2181
        env:
          ZOOKEEPER_CLIENT_PORT: 2181
          ZOOKEEPER_TICK_TIME: 2000

      kafka:
        image: confluentinc/cp-kafka:7.4.0
        ports:
          - 9092:9092
        env:
          KAFKA_BROKER_ID: 1
          KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
          # GitHub Actions services share a network — localhost works for the runner
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'

      postgres:
        image: postgres:14-alpine
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_weather_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Wait for Kafka to be ready
        run: |
          echo "⏳ Waiting for Kafka..."
          for i in $(seq 1 30); do
            if docker run --rm --network host confluentinc/cp-kafka:7.4.0 \
              kafka-topics --bootstrap-server localhost:9092 --list > /dev/null 2>&1; then
              echo "✅ Kafka is ready"
              break
            fi
            echo "  attempt $i/30 — retrying in 5s..."
            sleep 5
          done

      - name: Check code formatting (Black)
        run: black --check --diff producer/ consumer/ utils/ storage/

      - name: Lint — errors only (flake8)
        run: |
          flake8 producer/ consumer/ utils/ storage/ \
            --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Lint — style warnings (flake8)
        run: |
          flake8 producer/ consumer/ utils/ storage/ \
            --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Run unit tests
        env: *test-env
        run: |
          python -m pytest tests/ -v \
            --cov=producer --cov=consumer --cov=utils --cov=storage \
            --cov-report=xml --cov-report=term-missing

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # ── Integration tests ────────────────────────────────────────────────────────
  integration-test:
    runs-on: ubuntu-latest
    needs: test

    services:
      zookeeper:
        image: confluentinc/cp-zookeeper:7.4.0
        ports:
          - 2181:2181
        env:
          ZOOKEEPER_CLIENT_PORT: 2181
          ZOOKEEPER_TICK_TIME: 2000

      kafka:
        image: confluentinc/cp-kafka:7.4.0
        ports:
          - 9092:9092
        env:
          KAFKA_BROKER_ID: 1
          KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'

      postgres:
        image: postgres:14-alpine
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_weather_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Wait for Kafka to be ready
        run: |
          echo "⏳ Waiting for Kafka..."
          for i in $(seq 1 30); do
            if docker run --rm --network host confluentinc/cp-kafka:7.4.0 \
              kafka-topics --bootstrap-server localhost:9092 --list > /dev/null 2>&1; then
              echo "✅ Kafka is ready"
              break
            fi
            echo "  attempt $i/30 — retrying in 5s..."
            sleep 5
          done

      - name: Run integration tests
        env: *test-env
        run: python -m pytest integration_tests/ -v

  # ── Docker build & push ──────────────────────────────────────────────────────
  docker-build:
    runs-on: ubuntu-latest
    needs: [ test, integration-test ]
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/weather-pipeline:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/weather-pipeline:${{ github.sha }}
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/weather-pipeline:latest
          cache-to: type=inline

  # ── Staging deploy ───────────────────────────────────────────────────────────
  deploy-staging:
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to staging
        run: |
          echo "🚀 Deploying to staging..."
          # Add your deployment commands here, e.g.:
          # kubectl apply -f k8s/staging/
          # docker-compose -f docker-compose.staging.yml up -d

  # ── Security scan ─────────────────────────────────────────────────────────────
  # Only runs on pull_request — dependency-review-action requires a base to diff against
  security-scan:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Dependency review
        uses: actions/dependency-review-action@v4

      - name: Semgrep SAST
        uses: semgrep/semgrep-action@v1
        with:
          config: p/ci

  # ── Slack notifications ───────────────────────────────────────────────────────
  notify:
    runs-on: ubuntu-latest
    needs: [ test, integration-test, docker-build ]
    if: always()

    steps:
      - name: Notify Slack on failure
        if: failure()
        uses: 8398a7/action-slack@v3
        with:
          status: failure
          text: |
            ❌ Weather Pipeline CI failed on branch `${{ github.ref_name }}`
            Commit: ${{ github.sha }}
            Author: ${{ github.actor }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}